spring.application.name=keep-app
server.port=8081

# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/keep_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.server.server.entity
mybatis.configuration.map-underscore-to-camel-case=true

# 文件上传
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# 静态资源
spring.web.resources.static-locations=classpath:/static/

# JWT密钥
jwt.secret=keepAppSecretKey2024VeryLongSecretKeyForJWTSigning
jwt.expiration=86400000

# 文件存储路径
file.upload.path=server/uploads/

# 日志
logging.level.com.server.server=DEBUG

spring.boot.admin.client.url=http://localhost:8081
agent.api.url=${AGENT_API_URL:https://api.deepseek.com/chat/completions}
agent.api.key=${DEEPSEEK_API_KEY:${AGENT_API_KEY:}}
agent.api.model=${AGENT_API_MODEL:deepseek-flash}
